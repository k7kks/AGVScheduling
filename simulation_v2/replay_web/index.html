<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGV 演示回放</title>
    <style>
      :root {
        --bg: #07111f;
        --panel: rgba(8, 18, 31, 0.84);
        --line: rgba(255, 255, 255, 0.08);
        --text: #eef4ff;
        --muted: #9bb1d0;
        --soft: rgba(255, 255, 255, 0.08);
        --accent: #2ec4b6;
        --accent-soft: rgba(46, 196, 182, 0.14);
        --warn: #ff9f43;
        --warn-soft: rgba(255, 159, 67, 0.14);
        --shadow: 0 24px 50px rgba(0, 0, 0, 0.28);
      }

      * {
        box-sizing: border-box;
        scrollbar-color: rgba(255, 255, 255, 0.18) rgba(255, 255, 255, 0.05);
        scrollbar-width: thin;
      }

      *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      *::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 999px;
      }

      *::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      *::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.28);
        background-clip: padding-box;
      }

      body {
        margin: 0;
        font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 10%, rgba(69, 183, 209, 0.18), transparent 28%),
          radial-gradient(circle at 85% 15%, rgba(255, 159, 67, 0.16), transparent 24%),
          linear-gradient(160deg, #07111f 0%, #0b1628 55%, #08131d 100%);
        min-height: 100vh;
      }

      #app {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr) 420px;
        gap: 16px;
        height: 100vh;
        min-height: 100vh;
        padding: 16px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(18px);
        min-width: 0;
      }

      #sidebar,
      #focusbar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: calc(100vh - 32px);
      }

      .section {
        padding: 20px;
      }

      .section + .section {
        border-top: 1px solid var(--line);
      }

      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #ffca8a;
      }

      h1 {
        margin: 10px 0 8px 0;
        font-size: 28px;
        line-height: 1.15;
      }

      .subtitle {
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
      }

      .badges,
      #focus-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-radius: 999px;
        background: var(--soft);
        color: #dce7ff;
        font-size: 12px;
        font-weight: 600;
      }

      .control-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .btn,
      select,
      input[type="range"] {
        width: 100%;
      }

      .btn,
      select {
        appearance: none;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        padding: 11px 14px;
        font-size: 13px;
        font-weight: 700;
      }

      .btn {
        cursor: pointer;
      }

      .btn.primary {
        background: linear-gradient(135deg, #2ec4b6 0%, #2b90d9 100%);
        color: #031019;
        border-color: transparent;
      }

      .btn.subtle {
        background: rgba(255, 255, 255, 0.06);
      }

      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 14px;
        font-size: 13px;
        color: #dbe7fa;
      }

      .toggle input {
        accent-color: var(--warn);
      }

      .section-title {
        font-size: 14px;
        font-weight: 800;
      }

      .section-note {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
      }

      #event-list {
        flex: 1;
        overflow: auto;
        padding: 0 12px 16px 12px;
        min-height: 0;
      }

      .scene-item {
        padding: 14px;
        margin: 0 8px 10px 8px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        cursor: pointer;
        transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
      }

      .scene-item:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.16);
      }

      .scene-item.active {
        border-color: rgba(255, 159, 67, 0.75);
        background: rgba(255, 159, 67, 0.14);
      }

      .scene-index {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 12px;
        font-weight: 800;
        color: var(--text);
      }

      .scene-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .scene-time {
        margin-top: 10px;
        font-size: 11px;
        color: #ffca8a;
        font-weight: 700;
      }

      .scene-title {
        margin-top: 10px;
        font-size: 15px;
        font-weight: 800;
      }

      .scene-subtitle {
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.55;
        color: var(--muted);
      }

      #stage {
        position: relative;
        min-width: 0;
      }

      #main-canvas {
        width: 100%;
        height: calc(100vh - 124px);
        display: block;
        background:
          radial-gradient(circle at 25% 20%, rgba(46, 196, 182, 0.14), transparent 30%),
          radial-gradient(circle at 82% 82%, rgba(255, 159, 67, 0.14), transparent 34%),
          #05101c;
        cursor: grab;
      }

      #main-canvas.dragging {
        cursor: grabbing;
      }

      #overlay {
        position: absolute;
        left: 20px;
        right: 20px;
        top: 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        pointer-events: none;
      }

      #banner {
        max-width: 560px;
        padding: 16px 18px;
        border-radius: 20px;
        background: rgba(5, 13, 23, 0.82);
        border: 1px solid var(--line);
        box-shadow: 0 16px 28px rgba(0, 0, 0, 0.22);
      }

      #banner .title {
        margin-top: 8px;
        font-size: 28px;
        font-weight: 900;
      }

      #banner .desc {
        margin-top: 8px;
        font-size: 14px;
        line-height: 1.65;
        color: #c2d2ea;
      }

      #stage-badges {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }

      #speed-badge,
      #camera-badge {
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(5, 13, 23, 0.82);
        border: 1px solid var(--line);
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.18);
      }

      #transport {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 18px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 14px;
        border-radius: 20px;
        background: rgba(5, 13, 23, 0.88);
        border: 1px solid var(--line);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
      }

      .transport-actions {
        display: flex;
        gap: 10px;
        min-width: 210px;
      }

      .transport-actions .btn {
        width: 100px;
        flex: 0 0 100px;
      }

      input[type="range"] {
        accent-color: var(--accent);
      }

      #time-label {
        min-width: 150px;
        text-align: right;
        font-size: 13px;
        font-weight: 800;
        color: #dbe7fa;
      }

      #focus-canvas {
        display: none;
      }

      #focus-title {
        font-size: 22px;
        font-weight: 900;
        min-height: 28px;
      }

      #focus-subtitle {
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.65;
        color: #b4c7e4;
        min-height: 68px;
      }

      #focus-meta {
        min-height: 34px;
        align-content: flex-start;
      }

      #detail-content {
        flex: 1;
        overflow: auto;
        padding: 0 16px 18px 16px;
        min-height: 0;
      }

      .detail-card {
        margin-bottom: 14px;
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
      }

      .detail-card-title {
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 12px;
      }

      .task-list,
      .assignment-list,
      .path-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 360px;
        overflow: auto;
        padding-right: 6px;
      }

      .scroll-pane {
        cursor: grab;
      }

      .scroll-pane.dragging {
        cursor: grabbing;
        user-select: none;
      }

      .task-row,
      .path-row {
        padding: 11px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.06);
      }

      .task-row {
        display: grid;
        grid-template-columns: 64px 1fr;
        gap: 12px;
        align-items: start;
      }

      .task-tag,
      .agv-tag,
      .status-tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 56px;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .task-tag,
      .agv-tag {
        background: rgba(46, 196, 182, 0.16);
        color: #b8fff7;
      }

      .status-tag {
        background: rgba(255, 255, 255, 0.08);
        color: #dbe7fa;
      }

      .status-tag.active {
        background: rgba(255, 159, 67, 0.16);
        color: #ffd6a8;
      }

      .task-body {
        min-width: 0;
      }

      .task-main,
      .path-main {
        font-size: 13px;
        font-weight: 700;
      }

      .task-meta,
      .path-meta,
      .detail-meta-text {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.55;
      }

      .assignment-button {
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        cursor: pointer;
        transition: border-color 120ms ease, background 120ms ease;
      }

      .assignment-button.active {
        border-color: rgba(255, 159, 67, 0.65);
        background: rgba(255, 159, 67, 0.14);
      }

      .assignment-button:disabled {
        cursor: default;
        opacity: 0.66;
      }

      .assignment-top {
        display: grid;
        grid-template-columns: auto auto 1fr;
        gap: 12px;
        align-items: baseline;
      }

      .assignment-agv {
        font-size: 13px;
        font-weight: 800;
      }

      .assignment-eta {
        font-size: 12px;
        font-weight: 700;
        color: #ffca8a;
        justify-self: end;
      }

      .assignment-chain {
        margin-top: 6px;
        font-size: 12px;
        color: #dbe7fa;
        line-height: 1.55;
        font-family: "JetBrains Mono", "SFMono-Regular", monospace;
      }

      .focus-hint {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--accent-soft);
        font-size: 12px;
        line-height: 1.6;
        color: #aef7ef;
      }

      .bridge-badge {
        display: inline-flex;
        align-items: center;
        padding: 5px 8px;
        border-radius: 999px;
        background: var(--warn-soft);
        color: #ffd6a8;
        font-size: 11px;
        font-weight: 800;
      }

      @media (max-width: 1200px) {
        #app {
          grid-template-columns: 260px 1fr;
          height: 100vh;
        }

        #focusbar {
          display: none;
        }
      }

      @media (max-width: 960px) {
        #app {
          grid-template-columns: 1fr;
          height: auto;
        }

        #sidebar {
          order: 2;
          height: auto;
        }

        #stage {
          order: 1;
        }

        #main-canvas {
          height: 68vh;
        }

        #overlay {
          flex-direction: column;
        }

        #stage-badges {
          align-items: flex-start;
        }

        #transport {
          grid-template-columns: 1fr;
        }

        #time-label {
          text-align: left;
        }

        #focusbar {
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" class="panel">
        <div class="section">
          <div class="eyebrow">Leader Replay</div>
          <h1>调度演示回放</h1>
          <div class="subtitle">5 个高层场景，进度条可拖动，点击 AGV 可高亮首次全局 Path。</div>
          <div class="badges" id="top-badges"></div>
        </div>

        <div class="section">
          <div class="control-grid">
            <button id="btn-prev-event" class="btn subtle">上一场景</button>
            <button id="btn-next-event" class="btn subtle">下一场景</button>
          </div>
          <div class="control-grid">
            <select id="speed-select">
              <option value="1" selected>播放 1.0x</option>
              <option value="1.25">播放 1.25x</option>
              <option value="1.5">播放 1.5x</option>
              <option value="2">播放 2.0x</option>
            </select>
            <button id="btn-view-reset" class="btn">视角复位</button>
          </div>
          <label class="toggle">
            <span>显示桥区域</span>
            <input id="toggle-bridges" type="checkbox" checked />
          </label>
        </div>

        <div class="section">
          <div class="section-title">Scenes</div>
          <div class="section-note">这里只显示 5 个核心场景，不显示零碎小事件。</div>
        </div>
        <div id="event-list"></div>
      </aside>

      <main id="stage" class="panel">
        <canvas id="main-canvas"></canvas>

        <div id="overlay">
          <div id="banner">
            <div class="eyebrow" id="banner-eyebrow">Scene</div>
            <div class="title" id="banner-title">加载中</div>
            <div class="desc" id="banner-desc">正在读取回放数据。</div>
          </div>
          <div id="stage-badges">
            <div id="speed-badge">1.0x</div>
            <div id="camera-badge">自动镜头</div>
          </div>
        </div>

        <div id="transport">
          <div class="transport-actions">
            <button id="btn-play" class="btn primary">播放</button>
            <button id="btn-reset" class="btn">回到开头</button>
          </div>
          <input id="timeline" type="range" min="0" max="1" step="0.001" value="0" />
          <div id="time-label">0.0s / 0.0s</div>
        </div>
      </main>

      <aside id="focusbar" class="panel">
        <div class="section">
          <div id="focus-title">场景说明</div>
          <div id="focus-subtitle">当前场景的说明与演示卡片会显示在这里。</div>
          <div id="focus-meta"></div>
        </div>
        <canvas id="focus-canvas"></canvas>
        <div id="detail-content"></div>
      </aside>
    </div>

    <script src="app.js"></script>
  </body>
</html>
